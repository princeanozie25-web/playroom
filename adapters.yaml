# The ONLY place a provider is named (roadmap §6). Room and API code reference
# adapters by `id` only — never by provider. Prices are USD per 1,000 tokens.
#
# Model + prices resolved 2026-07-24 from Anthropic's docs:
#   https://platform.claude.com/docs/en/docs/about-claude/pricing
#   Claude Haiku 4.5 — base input $1/MTok, output $5/MTok (→ /1k below).
# Haiku 4.5 is chosen for a concise, low-latency room agent (§7 first-token budget).
# ADAPTER CONFIGURATION ONLY, as of S1.1a.
#
# `display_name` and `principal` used to live here, and a `principals:` block with them.
# They were roster facts in an adapter config file, which was correct while the roster WAS
# configuration. They are records now — `principals` and `members`, migration 007 — and the
# web tier reads them from the API rather than from this file.
#
# `mandate_label` was here too and went in M-3: descriptive text that looked like authority
# while nothing enforced it. A field whose value nothing enforces is a lie-shaped hole.
#
# WHAT REMAINS IS WHAT RUNS AN ADAPTER: which provider, which model, whether it is enabled,
# its output cap and its prices. This is still the only file in the repository that names a
# provider (§6), and nothing outside packages/adapters/ reads it.
adapters:
  - id: claude-main
    provider: anthropic
    model: claude-haiku-4-5-20251001
    enabled: true
    max_output_tokens: 1024
    cost_per_1k_in: 0.001
    cost_per_1k_out: 0.005
  - id: sol
    provider: openai
    model: gpt-4o-mini
    enabled: true
    max_output_tokens: 1024
    # USD per 1,000 tokens. Config, not constants — a price change is not a release.
    cost_per_1k_in: 0.00015
    cost_per_1k_out: 0.0006
