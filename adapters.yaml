# The ONLY place a provider is named (roadmap §6). Room and API code reference
# adapters by `id` only — never by provider. Prices are USD per 1,000 tokens.
#
# Model + prices resolved 2026-07-24 from Anthropic's docs:
#   https://platform.claude.com/docs/en/docs/about-claude/pricing
#   Claude Haiku 4.5 — base input $1/MTok, output $5/MTok (→ /1k below).
# Haiku 4.5 is chosen for a concise, low-latency room agent (§7 first-token budget).
# ADAPTER CONFIGURATION ONLY, as of S1.1a.
#
# `display_name` and `principal` used to live here, and a `principals:` block with them.
# They were roster facts in an adapter config file, which was correct while the roster WAS
# configuration. They are records now — `principals` and `members`, migration 007 — and the
# web tier reads them from the API rather than from this file.
#
# `mandate_label` was here too and went in M-3: descriptive text that looked like authority
# while nothing enforced it. A field whose value nothing enforces is a lie-shaped hole.
#
# WHAT REMAINS IS WHAT RUNS AN ADAPTER: which provider, which model, whether it is enabled,
# its output cap and its prices. This is still the only file in the repository that names a
# provider (§6), and nothing outside packages/adapters/ reads it.
adapters:
  - id: claude-main
    provider: anthropic
    model: claude-haiku-4-5-20251001
    enabled: true
    max_output_tokens: 1024
    cost_per_1k_in: 0.001
    cost_per_1k_out: 0.005
  - id: sol
    provider: openai
    model: gpt-4o-mini
    enabled: true
    max_output_tokens: 1024
    # USD per 1,000 tokens. Config, not constants — a price change is not a release.
    cost_per_1k_in: 0.00015
    cost_per_1k_out: 0.0006
  # ── GUEST AGENTS (S-LIVE) ────────────────────────────────────────────────────────────
  #
  # One agent per guest principal, because a tester gets their own agent bound to their own
  # principal rather than a shared one. Two, matching migration 017's two slots, which are
  # capped by the four-hue accent palette and not by anything here.
  #
  # BOTH ON HAIKU, and that is a cost decision rather than a preference: these are the
  # adapters strangers can spend money through, so they get the cheapest concise model in
  # the registry. `sol` stays on a second provider because provider-neutrality is a claim
  # this repository makes and one adapter has to prove it.
  #
  # `max_output_tokens` is HALF the others'. A guest turn that runs long costs more and reads
  # worse on a phone, and the spend ceiling should be the second line of defence rather than
  # the first.
  - id: ada
    provider: anthropic
    model: claude-haiku-4-5-20251001
    enabled: true
    max_output_tokens: 512
    cost_per_1k_in: 0.001
    cost_per_1k_out: 0.005
  - id: bo
    provider: anthropic
    model: claude-haiku-4-5-20251001
    enabled: true
    max_output_tokens: 512
    cost_per_1k_in: 0.001
    cost_per_1k_out: 0.005
  # ── THE BRIEF-WRITER (AUDIT-FABLE) ───────────────────────────────────────────────────
  #
  # Same provider and model as claude-main, and that is the point: this is not a better
  # writer, it is a SEPARATE ONE. A standing order's stop-interrupts are charged to its
  # action member, so a loop that shares a member with everything else in the room spends
  # a budget it did not raise (S-DIAL). claude-audit exists to hold its own six.
  #
  # Its mandate is the narrowest in the directory: an empty scope, no protected actions,
  # nothing to co-sign. A member that writes briefs needs to read the room and post — and
  # neither of those is a governed action — so the honest scope is the empty one, and an
  # empty scope means every governed emission it could ever make is BLOCK by default.
  - id: claude-audit
    provider: anthropic
    model: claude-haiku-4-5-20251001
    enabled: true
    max_output_tokens: 1024
    cost_per_1k_in: 0.001
    cost_per_1k_out: 0.005
  # ── THE BRIDGED MEMBER (S-CC) ────────────────────────────────────────────────────────
  #
  # claude-code invokes a coding agent through the headless CLI (provider: claude-code), and its cost
  # is NOT tokens×price: the route surfaces the real total_cost_usd — cache creation, internal tool
  # iterations — which the adapter carries per turn (SCC-2). So the prices below are 0 DELIBERATELY,
  # not the typo .strict() exists to catch: they are unused, and the real cost is metered from the
  # route. DISABLED here in SCC-1 — the member record validates against this entry, but nothing
  # constructs or warms the adapter until SCC-2 adds the implementation and flips `enabled`.
  - id: claude-code
    provider: claude-code
    model: claude-opus-4-8
    enabled: false
    max_output_tokens: 8192
    cost_per_1k_in: 0
    cost_per_1k_out: 0
