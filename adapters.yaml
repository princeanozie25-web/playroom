# The ONLY place a provider is named (roadmap §6). Room and API code reference
# adapters by `id` only — never by provider. Prices are USD per 1,000 tokens.
#
# Model + prices resolved 2026-07-24 from Anthropic's docs:
#   https://platform.claude.com/docs/en/docs/about-claude/pricing
#   Claude Haiku 4.5 — base input $1/MTok, output $5/MTok (→ /1k below).
# Haiku 4.5 is chosen for a concise, low-latency room agent (§7 first-token budget).
# ROSTER FIELDS (S-UI). Until S1.1 lands a real membership model, this file is also
# the roster: display_name, principal and mandate_label are what the room renders in
# a member chip. They are read by the web app's SERVER layer, which projects only
# these three fields plus `id` — `provider` and `model` never leave this file, so §6
# holds. packages/adapters ignores them (its zod schema strips unknown keys).
#
# mandate_label is DESCRIPTIVE TEXT, NOT AUTHORITY. Nothing consults it and it
# enforces nothing. See the note in apps/web/app/roster.ts.
adapters:
  - id: claude-main
    provider: anthropic
    model: claude-haiku-4-5-20251001
    enabled: true
    max_output_tokens: 1024
    cost_per_1k_in: 0.001
    cost_per_1k_out: 0.005
    display_name: Claude
    principal: prince
    mandate_label: summon-only
